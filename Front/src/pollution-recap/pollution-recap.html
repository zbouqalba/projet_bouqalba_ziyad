<div class="recap-container">
  <div class="recap-top-actions">
    <button type="button" class="btn-back" (click)="onBackToList()">← Retour à la liste</button>
  </div>

  <h2>Détail de la Pollution</h2>

  @if (pollution(); as item) {
    <div class="recap-card" [appHighlightPollution]="item.niveau">
      <div class="recap-header">
        <h3>{{ item.title }}</h3>
        <span class="badge">{{ item.typePollution }}</span>
      </div>

      <div class="recap-body">
        <div class="info-group">
          <label>Description :</label>
          <p>{{ item.description }}</p>
        </div>

        <div class="info-grid">
          <div class="info-item">
            <label>Dangerosité :</label>
            <span>
              {{ item.niveau | pollutionLevel }} ({{ item.niveau }})
            </span>
          </div>
          <div class="info-item">
            <label>Date :</label>
            <span>{{ item.date }}</span>
          </div>
          <div class="info-item">
            <label>Lieu :</label>
            <span>{{ item.lieu }}</span>
          </div>
          <div class="info-item">
            <label>Latitude :</label>
            <span>{{ item.latitude }}</span>
          </div>
          <div class="info-item">
            <label>Longitude :</label>
            <span>{{ item.longitude }}</span>
          </div>
        </div>
      </div>

      @if (item.photo) {
      <div class="recap-image">
        <label>Photo :</label>
        <img [src]="item.photo" alt="Photo de la pollution" />
      </div>
      }
    </div>
  }
</div>
