<div class="recap-container">
  <h2>Récapitulatif de la Pollution</h2>

  <div class="recap-card">
    <div class="recap-header">
      <h3>{{ data.title }}</h3>
      <span class="badge">{{ data.typePollution }}</span>
    </div>

    <div class="recap-body">
      <div class="info-group">
        <label>Description :</label>
        <p>{{ data.description }}</p>
      </div>

      <div class="info-grid">
        <div class="info-item">
          <label>Date :</label>
          <span>{{ data.date }}</span>
        </div>
        <div class="info-item">
          <label>Lieu :</label>
          <span>{{ data.lieu }}</span>
        </div>
        <div class="info-item">
          <label>Latitude :</label>
          <span>{{ data.latitude }}</span>
        </div>
        <div class="info-item">
          <label>Longitude :</label>
          <span>{{ data.longitude }}</span>
        </div>
      </div>
    </div>

    @if (data.photo) {
      <div class="recap-image">
        <label>Photo :</label>
        <img [src]="data.photo" alt="Photo de la pollution" />
      </div>
    }
  </div>
</div>
