@if (user(); as profile) {
<div class="card-container">
    <div class="success-card">
        <h2>Bienvenue, {{ profile.nom }} !</h2>
        <p class="success-subtitle">Vos informations de session :</p>

        <div class="info-list">
            <div class="info-item">
                <span class="info-label">Nom :</span>
                <span class="info-value">{{ profile.nom }}</span>
            </div>
            <div class="info-item">
                <span class="info-label">Adresse E-mail :</span>
                <span class="info-value">{{ profile.email }}</span>
            </div>
            <div class="info-item">
                <span class="info-label">Rôle :</span>
                <span class="info-value">{{ profile.role }}</span>
            </div>
        </div>

        <button (click)="onBienvenueClick()" class="reset-btn">
            Continuer vers les pollutions
        </button>
    </div>
</div>
}
