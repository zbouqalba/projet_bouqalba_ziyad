@if (isAuthenticated()) {
<header class="app-navbar">
  <div class="nav-links">
    <a
      routerLink="/pollutions"
      routerLinkActive="active"
      class="nav-item"
    >
      Pollutions
    </a>
    <a
      routerLink="/users"
      routerLinkActive="active"
      class="nav-item"
    >
      Utilisateurs
    </a>
  </div>

  <div class="nav-actions">
    @if (currentUser(); as user) {
      <span class="user-greeting">{{ user.firstName }} {{ user.lastName }}</span>
    }
    <button type="button" class="btn-logout" (click)="onLogout()">
      Déconnexion
    </button>
  </div>
</header>
}

<main class="main-container">
  <router-outlet></router-outlet>
</main>
